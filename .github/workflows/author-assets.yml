name: Author Blender landmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install Blender with bounded mirror retries
        timeout-minutes: 5
        run: |
          sudo sed -i -E 's|https?://[^ /]*azure[^ /]*/ubuntu/?|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends blender python3-numpy
      - run: blender --background --threads 2 --python-exit-code 1 --python scripts/blender-landmarks.py -- --output artifacts/blender-landmarks
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: error
          name: blender-landmarks
          path: artifacts/blender-landmarks/
