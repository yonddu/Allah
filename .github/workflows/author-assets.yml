name: Author Blender landmarks
on:
  push:
    branches: [main]
    paths:
      - scripts/blender-landmarks.py
      - .github/workflows/author-assets.yml
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y --no-install-recommends blender python3-numpy
      - run: blender --background --threads 2 --python-exit-code 1 --python scripts/blender-landmarks.py -- --output artifacts/blender-landmarks
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: error
          name: blender-landmarks
          path: artifacts/blender-landmarks/
